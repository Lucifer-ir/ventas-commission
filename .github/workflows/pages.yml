name: Deploy Ventas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run commission engine tests
        run: python -m unittest -v tests/test_commission_engine.py
      - name: Check frontend JavaScript syntax
        run: |
          python - <<'PY'
          import re
          source = open("index.html", encoding="utf-8").read()
          scripts = re.findall(r"<script>(.*?)</script>", source, flags=re.S)
          if not scripts:
              raise SystemExit("No inline application script found")
          open("/tmp/ventas-inline.js", "w", encoding="utf-8").write("\n".join(scripts))
          PY
          node --check /tmp/ventas-inline.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
